<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿</title>
    <!-- Chart.js（グラフ描画用） -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --expense: #dc2626;
            --income: #16a34a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --auth-grad: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 50%, #faf5ff 100%);
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            box-sizing: border-box; 
            transition: background-color 0.5s ease;
        }

        body.auth-mode {
            background: var(--auth-grad);
        }

        .auth-container { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.15), 0 1px 3px rgba(0, 0, 0, 0.05); 
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%);
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .auth-container h1 { 
            font-size: 20px; 
            font-weight: 800; 
            color: #0f172a; 
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .container { 
            background: var(--card); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 440px; 
            display: none; 
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { color: var(--text); font-size: 18px; margin-top: 25px; border-bottom: 2px solid var(--border); padding-bottom: 6px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        label { font-size: 13px; color: var(--text-light); margin-bottom: -8px; font-weight: 700; }
        
        input, select, button { 
            padding: 12px 14px; 
            font-size: 15px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            width: 100%; 
            background-color: #ffffff;
            color: var(--text);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12); }
        
        input[type="date"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: #ffffff;
            border: 1px solid var(--border);
        }
        
        .pin-field {
            background: rgba(241, 245, 249, 0.6);
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
        }
        .pin-field:focus {
            background: #ffffff;
            border-color: var(--primary);
        }

        .type-selector { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .type-btn { background: #f1f5f9; color: var(--text-light); border: none; border-radius: 0; cursor: pointer; padding: 12px; font-size: 15px; width: 50%; font-weight: 600; }
        .type-btn.active-ex { background-color: var(--expense); color: white; }
        .type-btn.active-in { background-color: var(--income); color: white; }
        
        .receipt-zone { background: #f5f3ff; border: 2px dashed #c084fc; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .receipt-zone:hover { background: #f3e8ff; }
        .receipt-icon { font-size: 28px; display: block; margin-bottom: 5px; }
        .receipt-text { font-size: 13px; color: #7e22ce; font-weight: bold; }
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .action-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.1);
        }
        .modal-overlay.active .action-sheet {
            transform: translateY(0);
        }
        .sheet-title {
            font-size: 14px; color: var(--text-light); text-align: center; margin-bottom: 18px; font-weight: 600;
        }
        .sheet-btn {
            background: #f1f5f9; color: var(--text); border: none; margin-bottom: 12px; font-weight: 600; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        }
        .sheet-btn:hover { background: #e2e8f0; }
        .sheet-btn.cancel {
            background: #ffe4e6; color: #b91c1c; margin-top: 8px; margin-bottom: 0;
        }
        .sheet-btn.cancel:hover { background: #fecdd3; }

        .period-selector { display: flex; gap: 6px; align-items: center; }
        .period-select { padding: 6px 10px; font-size: 13px; width: auto; background: #ffffff; }
        .chart-container { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        
        .chart-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: bold; }
        .chart-back-btn { background: #4f46e5; color: white; border: none; padding: 4px 10px; font-size: 11px; border-radius: 20px; cursor: pointer; width: auto; display: none; }
        .chart-back-btn:hover { background: #3830b9; }
        .chart-tip { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 8px; display: block; }
        
        button.submit-btn { background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.3); }
        button.submit-btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 16px -2px rgba(79, 70, 229, 0.4); }
        button.submit-btn:active { transform: translateY(0); }
        button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        
        ul { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow-y: auto; }
        li { background: #ffffff; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border: 1px solid var(--border); border-left: 6px solid #ccc; }
        li.ex-item { border-left-color: var(--expense); }
        li.in-item { border-left-color: var(--income); }
        
        .item-main { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .item-action-area { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .item-actions { display: flex; gap: 6px; }
        .action-btn { background: #f1f5f9; border: 1px solid var(--border); cursor: pointer; padding: 4px 8px; font-size: 12px; border-radius: 6px; width: auto; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { background: #e2e8f0; }
        .action-btn.edit { color: #2563eb; }
        .action-btn.delete { color: #dc2626; }
        
        .loading { font-size: 14px; color: var(--text-light); text-align: center; display: none; margin-bottom: 10px; }
        .error-msg { color: var(--expense); font-size: 13px; margin-top: 10px; font-weight: 600; text-align: center; }
        .badge-type { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; margin-right: 4px; display: inline-block; }
        .badge-type.ex { background-color: var(--expense); }
        .badge-type.in { background-color: var(--income); }
        .badge-loc { background: #e2e8f0; color: #4a5568; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .text-notes { color: var(--text-light); font-size: 12px; display: block; margin-top: 2px; }
    </style>
</head>
<body class="auth-mode">

    <div id="auth-box" class="auth-container">
        <div class="auth-logo">🔐</div>
        <h1>家計簿セキュリティ認証</h1>
        <div class="auth-subtitle">
            データを暗号化して同期するため、<br>ご家族共通のPINコードを入力してください。
        </div>
        <div class="form-group" style="gap: 16px;">
            <input type="password" id="pin-input" class="pin-field" inputmode="numeric" placeholder="PIN" maxlength="12" style="text-align: center; font-size: 24px; letter-spacing: 6px; padding: 14px;">
            <button id="login-btn" class="submit-btn" style="padding: 14px;">安全に入室する</button>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <div id="app-box" class="container">
        <h1>📝 家計簿</h1>
        
        <div class="type-selector">
            <button type="button" id="btn-expense" class="type-btn active-ex">支出</button>
            <button type="button" id="btn-income" class="type-btn">収入</button>
        </div>

        <div id="receipt-area" class="receipt-zone">
            <span class="receipt-icon" id="receipt-status-icon">📸</span>
            <span class="receipt-text" id="receipt-status-text">レシートを撮影して自動入力</span>
            
            <input type="file" id="receipt-camera" accept="image/*" capture="environment" style="display: none;">
            <input type="file" id="receipt-album" accept="image/*" style="display: none;">
        </div>

        <div class="form-group">
            <label for="date-input">📅 日付</label>
            <input type="date" id="date-input">

            <label for="category">🗂️ 項目</label>
            <select id="category"></select>

            <label for="amount">💰 金額</label>
            <input type="number" id="amount" placeholder="金額 (円)" inputmode="numeric">

            <label for="location">📍 場所</label>
            <input type="text" id="location" placeholder="場所（例: スーパー、Amazon）">

            <label for="notes">💬 メモ</label>
            <input type="text" id="notes" placeholder="メモ・備考（自由入力）">

            <button id="add-btn" class="submit-btn">データを同期して記録</button>
        </div>
        
        <h2>
            <span>📊 収支レポート</span>
            <div class="period-selector">
                <select id="select-year" class="period-select"></select>
                <select id="select-month" class="period-select">
                    <option value="all">年次(全体)</option>
                    <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
                    <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
                    <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
                    <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
            </div>
        </h2>
        <div class="chart-container">
            <div class="chart-nav">
                <span id="chart-title">カテゴリー別分析</span>
                <button id="chart-back-btn" class="chart-back-btn" onclick="drillUp()">👈 全体に戻る</button>
            </div>
            <canvas id="myChart" width="400" height="300"></canvas>
            <span id="chart-tip-text" class="chart-tip">💡 グラフの項目をタップすると店舗別の内訳が見られます</span>
        </div>

        <h2>履歴一覧</h2>
        <div id="loading-status" class="loading">データを最新に同期中...</div>
        <ul id="history-list"></ul>
    </div>

    <div id="upload-modal" class="modal-overlay">
        <div class="action-sheet">
            <div class="sheet-title">レシートの読み込み方法を選択</div>
            <button id="choose-camera" class="sheet-btn">📷 いまカメラで撮影する</button>
            <button id="choose-album" class="sheet-btn">🖼️ 写真アルバムから選ぶ</button>
            <button id="close-modal" class="sheet-btn cancel">キャンセル</button>
        </div>
    </div>

    <script>
        // ⚠️ 新しいデプロイ後のURLにここを書き換えてください
        const API_URL = "https://script.google.com/macros/s/AKfycbw9M0Y5blppK97M_HtfCYbSHzJwpOimSkJmVuGB8ARMtynrG_CEp3Lgtdh_kpqdKBS5GQ/exec";
        
        let currentPin = "";
        let currentType = "支出";
        let serverCategories = { "支出": [], "収入": [] }; 
        let globalRecords = [];
        let myChart = null;
        let editingIndex = null; 
        let drillDownCategory = null; 

        const authBox = document.getElementById('auth-box');
        const appBox = document.getElementById('app-box');
        const pinInput = document.getElementById('pin-input');
        const loginBtn = document.getElementById('login-btn');
        const authError = document.getElementById('auth-error');

        const btnExpense = document.getElementById('btn-expense');
        const btnIncome = document.getElementById('btn-income');
        const receiptArea = document.getElementById('receipt-area');
        
        const receiptCamera = document.getElementById('receipt-camera');
        const receiptAlbum = document.getElementById('receipt-album');
        
        const uploadModal = document.getElementById('upload-modal');
        const chooseCamera = document.getElementById('choose-camera');
        const chooseAlbum = document.getElementById('choose-album');
        const closeModal = document.getElementById('close-modal');

        const receiptStatusIcon = document.getElementById('receipt-status-icon');
        const receiptStatusText = document.getElementById('receipt-status-text');
        const dateInput = document.getElementById('date-input');
        const categorySelect = document.getElementById('category');
        const amountInput = document.getElementById('amount');
        const locationInput = document.getElementById('location');
        const notesInput = document.getElementById('notes');
        const addBtn = document.getElementById('add-btn');
        const historyList = document.getElementById('history-list');
        const loadingStatus = document.getElementById('loading-status');
        
        const selectYear = document.getElementById('select-year');
        const selectMonth = document.getElementById('select-month');

        const chartTitle = document.getElementById('chart-title');
        const chartBackBtn = document.getElementById('chart-back-btn');
        const chartTipText = document.getElementById('chart-tip-text');

        function initPeriodSelectors() {
            const now = new Date();
            const currentYear = now.getFullYear();
            selectYear.innerHTML = "";
            for (let y = currentYear; y >= currentYear - 5; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = `${y}年`;
                selectYear.appendChild(opt);
            }
            const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
            selectMonth.value = currentMonth;
        }
        initPeriodSelectors();

        function setTodayDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;
        }
        setTodayDate();

        function updateCategoryOptions() {
            categorySelect.innerHTML = "";
            const list = (serverCategories && serverCategories[currentType]) ? serverCategories[currentType] : [];
            
            if(list.length === 0) {
                const opt = document.createElement('option');
                opt.value = "その他";
                opt.innerText = "その他";
                categorySelect.appendChild(opt);
                return;
            }

            list.forEach(cat => {
                if(cat) {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    categorySelect.appendChild(opt);
                }
            });
        }

        updateCategoryOptions();

        btnExpense.addEventListener('click', () => {
            currentType = "支出";
            btnExpense.classList.add('active-ex');
            btnIncome.classList.remove('active-in');
            receiptArea.style.display = "block";
            updateCategoryOptions();
            cancelEdit(); 
            drillUp(); 
            updateUI(globalRecords);
        });

        btnIncome.addEventListener('click', () => {
            currentType = "収入";
            btnIncome.classList.add('active-in');
            btnExpense.classList.remove('active-ex');
            receiptArea.style.display = "none";
            updateCategoryOptions();
            cancelEdit(); 
            drillUp(); 
            updateUI(globalRecords);
        });

        receiptArea.addEventListener('click', () => {
            if (receiptStatusText.innerText.includes("解析中") || receiptStatusText.innerText.includes("読み取り中")) return;
            uploadModal.classList.add('active');
        });

        closeModal.addEventListener('click', () => uploadModal.classList.remove('active'));
        uploadModal.addEventListener('click', (e) => {
            if (e.target === uploadModal) uploadModal.classList.remove('active');
        });

        chooseCamera.addEventListener('click', () => {
            uploadModal.classList.remove('active');
            receiptCamera.click();
        });

        chooseAlbum.addEventListener('click', () => {
            uploadModal.classList.remove('active');
            receiptAlbum.click();
        });

        // 🖼️ 画像ファイルをブラウザ側で素早くリサイズし、Base64データ化してGASへ直送する処理
        async function processReceiptFile(file) {
            receiptStatusIcon.innerText = "⏳";
            receiptStatusText.innerText = "画像を処理中...";
            receiptArea.style.background = "#f1f5f9";
            
            try {
                // 画像をブラウザで読み込み
                const base64Raw = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (err) => reject(err);
                    reader.readAsDataURL(file);
                });

                // Googleサーバーへの送信時間を最速にするため、Canvasで画像を軽量にリサイズ・圧縮します
                const compressedBase64 = await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // GoogleのOCRに最適な幅にリサイズしてデータ量を減らします
                        const MAX_WIDTH = 800;
                        if (width > MAX_WIDTH) {
                            height = Math.round(height * (MAX_WIDTH / width));
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 画質を少し落としてデータ送信サイズを10分の1以下に圧縮
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = (err) => reject(err);
                    img.src = base64Raw;
                });

                receiptStatusText.innerText = "Google高速AIがレシートを解析中...";

                // リサイズしたBase64文字列（プレフィックス "data:image/jpeg;base64," を除く純粋なデータ部分）をGASにPOST
                const base64DataOnly = compressedBase64.split(',')[1];

                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        password: currentPin,
                        action: "analyzeReceipt",
                        imageBlob: base64DataOnly // GASの超高速Google OCRへ直接画像を渡す
                    })
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    // 金額、店舗名、メモ、日付の自動割り当て
                    if (result.amount && result.amount !== "0") amountInput.value = result.amount;
                    if (result.location) locationInput.value = result.location;
                    if (result.notes) notesInput.value = result.notes;
                    
                    if (result.date) {
                        const formattedDate = result.date.replace(/\//g, '-');
                        dateInput.value = formattedDate;
                    }
                    
                    // スプレッドシートの設定からAIが判定した最適なカテゴリをマッチングして選択
                    if (result.category) {
                        let exists = false;
                        for (let i = 0; i < categorySelect.options.length; i++) {
                            if (categorySelect.options[i].value === result.category) {
                                categorySelect.value = result.category;
                                exists = true;
                                break;
                            }
                        }
                        if (!exists && categorySelect.options.length > 0) {
                            const opt = document.createElement('option');
                            opt.value = result.category;
                            opt.innerText = result.category;
                            categorySelect.appendChild(opt);
                            categorySelect.value = result.category;
                        }
                    }
                    
                    alert("✨ 解析大成功！すべての項目を自動入力しました。確認して「記録」を押してください！");
                } else {
                    alert("AIによるデータ整理に失敗しました。手入力をお試しください。\nエラー: " + (result.message || "不明なエラー"));
                }
            } catch(err) {
                alert("通信エラーが発生しました。インターネット環境をお確かめください。");
                console.error(err);
            } finally {
                receiptStatusIcon.innerText = "📸";
                receiptStatusText.innerText = "レシートを撮影して自動入力";
                receiptArea.style.background = "#f8fafc";
                receiptCamera.value = "";
                receiptAlbum.value = "";
            }
        }

        receiptCamera.addEventListener('change', (e) => {
            if (e.target.files.length === 0) return;
            processReceiptFile(e.target.files[0]);
        });

        receiptAlbum.addEventListener('change', (e) => {
            if (e.target.files.length === 0) return;
            processReceiptFile(e.target.files[0]);
        });

        selectYear.addEventListener('change', () => renderChart());
        selectMonth.addEventListener('change', () => renderChart());

        loginBtn.addEventListener('click', async () => {
            const pin = pinInput.value;
            if (!pin) return;
            
            authError.innerText = "セキュリティ検証中...";
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}?password=${pin}`);
                const result = await response.json();
                
                if (result.status === "success") {
                    currentPin = pin;
                    if (result.categories) serverCategories = result.categories;
                    
                    authBox.style.display = "none";
                    appBox.style.display = "block";
                    document.body.style.alignItems = "flex-start";
                    document.body.style.paddingTop = "20px";
                    document.body.classList.remove('auth-mode');
                    
                    updateCategoryOptions();
                    globalRecords = result.records || [];
                    updateUI(globalRecords);
                } else {
                    authError.innerText = "PINコードが正しくありません。";
                    loginBtn.disabled = false;
                }
            } catch (e) {
                authError.innerText = "接続エラー。URLが正しいか確認してください。";
                loginBtn.disabled = false;
            }
        });

        pinInput.addEventListener('keydown', (e) => {
            if (e.key === "Enter") {
                e.preventDefault(); 
                loginBtn.click();
            }
        });

        async function fetchLatestData() {
            loadingStatus.style.display = "block";
            try {
                const response = await fetch(`${API_URL}?password=${currentPin}`);
                const result = await response.json();
                if (result.status === "success" && result.categories) {
                    serverCategories = result.categories; 
                    updateCategoryOptions();
                    globalRecords = result.records || [];
                    updateUI(globalRecords);
                }
            } catch (e) {
                console.error(e);
            }
            loadingStatus.style.display = "none";
        }

        function getCategoryHue(categoryName) {
            let hash = 0;
            for (let i = 0; i < categoryName.length; i++) {
                hash = categoryName.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash) % 360;
        }

        function generateCategoryColors(categories) {
            return categories.map(cat => {
                const hue = getCategoryHue(cat);
                return `hsl(${hue}, 65%, 55%)`; 
            });
        }

        function generateGradientColors(baseCategory, count) {
            const baseHue = getCategoryHue(baseCategory);
            const colors = [];
            const minL = 38;
            const maxL = 72;
            const step = count > 1 ? (maxL - minL) / (count - 1) : 0;

            for (let i = 0; i < count; i++) {
                const l = Math.floor(minL + (step * i));
                colors.push(`hsl(${baseHue}, 60%, ${l}%)`);
            }
            return colors;
        }

        function drillUp() {
            drillDownCategory = null;
            chartTitle.innerText = "カテゴリー別分析";
            chartBackBtn.style.display = "none";
            chartTipText.style.display = "block";
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            const targetYear = selectYear.value;
            const targetMonth = selectMonth.value;

            const baseFiltered = globalRecords.filter(r => {
                if (r.type !== currentType) return false;
                const parts = r.date.split('/');
                if (parts.length < 3) return false;
                const rYear = parts[0];
                const rMonth = parts[1];

                if (targetMonth === "all") {
                    return rYear === targetYear;
                } else {
                    return rYear === targetYear && rMonth === targetMonth;
                }
            });

            let labels = [];
            let dataValues = [];
            let chartColors = [];

            if (drillDownCategory === null) {
                const totals = {};
                baseFiltered.forEach(r => {
                    const cat = r.category || "その他";
                    totals[cat] = (totals[cat] || 0) + Number(r.amount);
                });
                labels = Object.keys(totals);
                dataValues = Object.values(totals);
                chartColors = generateCategoryColors(labels);
            } else {
                const storeTotals = {};
                baseFiltered.forEach(r => {
                    if (r.category === drillDownCategory) {
                        const storeName = r.location ? r.location.trim() : "未登録店舗";
                        storeTotals[storeName] = (storeTotals[storeName] || 0) + Number(r.amount);
                    }
                });
                labels = Object.keys(storeTotals);
                dataValues = Object.values(storeTotals);
                chartColors = generateGradientColors(drillDownCategory, labels.length);
            }

            if (myChart) {
                myChart.destroy();
            }

            if (labels.length === 0) {
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['データなし'],
                        datasets: [{ data: [1], backgroundColor: ['#e2e8f0'] }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });
                return;
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: chartColors
                    }]
                },
                options: {
                    responsive: true,
                    onClick: (event, elements) => {
                        if (elements.length > 0 && drillDownCategory === null) {
                            const index = elements[0].index;
                            const clickedCategory = labels[index];
                            drillDownCategory = clickedCategory;
                            chartTitle.innerText = `📍 [${clickedCategory}] 店舗別詳細`;
                            chartBackBtn.style.display = "block"; 
                            chartTipText.style.display = "none";
                            renderChart(); 
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}: ${Number(context.raw).toLocaleString()} 円`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateUI(records) {
            historyList.innerHTML = '';
            renderChart();
            if(!records || records.length === 0) {
                historyList.innerHTML = '<li style="color:#999; justify-content:center;">データがまだありません</li>';
                return;
            }
            const filteredRecords = records.filter(r => r.type === currentType);
            if(filteredRecords.length === 0) {
                historyList.innerHTML = `<li style="color:#999; justify-content:center;">${currentType}のデータはまだありません</li>`;
                return;
            }
            filteredRecords.forEach(r => {
                const li = document.createElement('li');
                li.className = r.type === "支出" ? "ex-item" : "in-item";
                let metaText = "";
                if (r.location) metaText += `<span class="badge-loc">📍 ${r.location}</span>`;
                if (r.notes) metaText += `<span class="text-notes">💬 ${r.notes}</span>`;
                const prefix = r.type === "支出" ? "-" : "+";
                const priceColor = r.type === "支出" ? "var(--expense)" : "var(--income)";
                const badgeClass = r.type === "支出" ? "ex" : "in";
                const realIndex = globalRecords.indexOf(r);
                li.innerHTML = `
                    <div class="item-main">
                        <div>
                            <span class="badge-type ${badgeClass}">[${r.type}]</span>
                            <strong style="font-size:15px;">${r.category || 'その他'}</strong>
                        </div>
                        <div style="margin-top: 4px; min-height: 14px;">${metaText}</div>
                        <span style="font-size:10px; color:#aaa; display:block; margin-top:2px;">${r.date}</span>
                    </div> 
                    <div class="item-action-area">
                        <span style="font-weight:bold; font-size:17px; color: ${priceColor}; white-space: nowrap;">
                            ${prefix}${Number(r.amount).toLocaleString()} 円
                        </span>
                        <div class="item-actions">
                            <button class="action-btn edit" onclick="startEdit(${realIndex})">✏️ 編集</button>
                            <button class="action-btn delete" onclick="deleteRecord(${realIndex})">🗑️ 削除</button>
                        </div>
                    </div>
                `;
                historyList.appendChild(li);
            });
        }

        function startEdit(index) {
            editingIndex = index;
            const item = globalRecords[index];
            const formattedDate = item.date.replace(/\//g, '-');
            dateInput.value = formattedDate;
            categorySelect.value = item.category;
            amountInput.value = item.amount;
            locationInput.value = item.location || '';
            notesInput.value = item.notes || '';
            addBtn.innerText = "変更を同期して保存";
            addBtn.style.backgroundColor = "#eab308"; 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingIndex = null;
            addBtn.innerText = "データを同期して記録";
            addBtn.style.backgroundColor = "var(--primary)";
            amountInput.value = '';
            locationInput.value = '';
            notesInput.value = '';
            setTodayDate();
        }

        async function deleteRecord(index) {
            const item = globalRecords[index];
            if (!confirm(`「${item.date} : ${Number(item.amount).toLocaleString()}円」を削除しますか？`)) return;
            loadingStatus.style.display = "block";
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        password: currentPin,
                        action: "deleteRecord",
                        type: item.type,
                        date: item.date,
                        category: item.category,
                        amount: item.amount,
                        location: item.location,
                        notes: item.notes
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    if (editingIndex === index) cancelEdit();
                    await fetchLatestData();
                }
            } catch(e) { alert("削除エラー"); }
            loadingStatus.style.display = "none";
        }

        addBtn.addEventListener('click', async () => {
            const amount = amountInput.value;
            const category = categorySelect.value;
            const location = locationInput.value;
            const notes = notesInput.value;
            const selectedDate = dateInput.value.replace(/-/g, '/');
            if (!amount || !selectedDate) return alert('入力内容を確認してください');
            
            addBtn.disabled = true;
            addBtn.innerText = "暗号化同期中...";
            
            const payload = {
                password: currentPin,
                type: currentType,
                category: category,
                amount: amount,
                location: location,
                notes: notes,
                customDate: selectedDate
            };

            if (editingIndex !== null) {
                payload.action = "editRecord";
                payload.oldDate = globalRecords[editingIndex].date;
                payload.oldCategory = globalRecords[editingIndex].category;
                payload.oldAmount = globalRecords[editingIndex].amount;
                payload.oldLocation = globalRecords[editingIndex].location;
                payload.oldNotes = globalRecords[editingIndex].notes;
            }

            try {
                const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === "success") {
                    cancelEdit(); 
                    await fetchLatestData();
                } else { alert(result.message); }
            } catch (e) { alert("送信エラー"); }
            addBtn.disabled = false;
        });
    </script>
</body>
</html>
